    <hr>
    <p dir="auto">Collision was created by, and is maintained by <strong><a href="https://github.com/nunomaduro">Nuno Maduro</a></strong>, and is a package designed to give you beautiful error reporting when interacting with your app through the command line.</p>
    <ul dir="auto">
    <li>It's included on <strong><a href="https://laravel.com" rel="nofollow">Laravel</a></strong>, the most popular free, open-source PHP framework in the world.</li>
    <li>Built on top of the <strong><a href="https://github.com/filp/whoops">Whoops</a></strong> error handler.</li>
    <li>Supports <a href="https://github.com/laravel/laravel">Laravel</a>, <a href="https://symfony.com" rel="nofollow">Symfony</a>, <a href="https://github.com/sebastianbergmann/phpunit">PHPUnit</a>, and many other frameworks.</li>
    </ul>
